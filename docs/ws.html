<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChatHub WS Tester</title>
<style>
  body { font-family: ui-monospace, Menlo, Consolas, monospace; background:#111; color:#ddd; margin:0; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; color:#fff; }
  .row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; align-items:center; }
  input, select { background:#222; color:#eee; border:1px solid #444; border-radius:4px; padding:6px 8px; font-family:inherit; }
  input[type=text], input[type=password] { flex:1; min-width:200px; }
  button { background:#2563eb; color:#fff; border:none; border-radius:4px; padding:7px 12px; cursor:pointer; font-family:inherit; }
  button:hover { background:#1d4ed8; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #status { font-size:13px; }
  #status.ok { color:#22c55e; }
  #status.err { color:#ef4444; }
  #log { background:#000; border:1px solid #333; border-radius:6px; height:55vh; overflow-y:auto; padding:8px; font-size:12px; white-space:pre-wrap; }
  .msg { margin-bottom:6px; }
  .in { color:#7dd3fc; }
  .out { color:#fcd34d; }
  .sys { color:#94a3b8; }
  .err { color:#f87171; }
  fieldset { border:1px solid #333; border-radius:6px; margin-bottom:10px; padding:10px; }
  legend { color:#93c5fd; font-size:12px; }
</style>
</head>
<body>
  <h1>ChatHub WebSocket Tester</h1>

  <fieldset>
    <legend>Connection</legend>
    <div class="row">
      <input type="password" id="token" placeholder="Clerk JWT (__clerk_db_jwt)" style="min-width:320px" />
      <button id="btnConnect">Connect</button>
      <button id="btnDisconnect" disabled>Disconnect</button>
      <span id="status" class="sys">Disconnected</span>
    </div>
    <div class="row">
      <label style="font-size:12px;color:#888">ws://localhost:5000/ws?token=...</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Chat actions</legend>
    <div class="row">
      <input type="text" id="chatId" placeholder="chatId (UUID)" style="min-width:320px" />
      <button id="btnJoin">join-room</button>
      <button id="btnLeave">leave-room</button>
      <button id="btnResync">resync</button>
    </div>
    <div class="row">
      <input type="text" id="content" placeholder="message content" style="min-width:320px" />
      <button id="btnSend">send-message</button>
      <button id="btnTyping">typing</button>
      <button id="btnStopTyping">stop-typing</button>
    </div>
    <div class="row">
      <label style="font-size:12px;color:#888">clientMessageId auto-generated per send (idempotency test: same chat + same content -> count stays 1)</label>
    </div>
  </fieldset>

  <div id="log"></div>

<script>
  const $ = id => document.getElementById(id);
  const log = document.createElement('div');
  let ws = null;
  let seq = 1;

  function addLog(dir, payload) {
    const line = document.createElement('div');
    line.className = 'msg ' + dir;
    const t = new Date().toLocaleTimeString();
    line.textContent = `[${t}] ${dir.toUpperCase()} ${JSON.stringify(payload)}`;
    $('log').appendChild(line);
    $('log').scrollTop = $('log').scrollHeight;
  }

  function setStatus(txt, cls) {
    const s = $('status');
    s.textContent = txt;
    s.className = cls || 'sys';
  }

  function send(type, data) {
    if (!ws || ws.readyState !== WebSocket.OPEN) { addLog('sys', {error: 'not connected'}); return; }
    const payload = { type, data };
    ws.send(JSON.stringify(payload));
    addLog('out', payload);
  }

  $('btnConnect').onclick = () => {
    const token = $('token').value.trim();
    if (!token) { setStatus('token required', 'err'); return; }
    const url = 'ws://localhost:5000/ws?token=' + encodeURIComponent(token);
    ws = new WebSocket(url);
    setStatus('Connecting...');

    ws.onopen = () => { setStatus('Connected', 'ok'); addLog('sys', {event: 'open'}); };
    ws.onmessage = e => { addLog('in', JSON.parse(e.data)); };
    ws.onerror = e => { setStatus('WS error', 'err'); addLog('err', {event: 'error'}); };
    ws.onclose = e => {
      setStatus('Disconnected (code ' + e.code + ')', 'err');
      addLog('sys', {event: 'close', code: e.code, reason: e.reason});
      ws = null;
    };
    $('btnConnect').disabled = true;
    $('btnDisconnect').disabled = false;
  };

  $('btnDisconnect').onclick = () => {
    if (ws) ws.close();
    $('btnConnect').disabled = false;
    $('btnDisconnect').disabled = true;
  };

  $('btnJoin').onclick = () => send('join-room', {chatId: $('chatId').value.trim()});
  $('btnLeave').onclick = () => send('leave-room', {chatId: $('chatId').value.trim()});
  $('btnResync').onclick = () => send('resync', {chatId: $('chatId').value.trim(), afterSeq: 0});
  $('btnSend').onclick = () => send('send-message', {
    chatId: $('chatId').value.trim(),
    content: $('content').value.trim(),
    clientMessageId: 'cm_' + Date.now() + '_' + (seq++)
  });
  $('btnTyping').onclick = () => send('typing', {chatId: $('chatId').value.trim(), userId: '', username: ''});
  $('btnStopTyping').onclick = () => send('stop-typing', {chatId: $('chatId').value.trim(), userId: ''});

  addLog('sys', {hint: 'Login to frontend first, copy __clerk_db_jwt, then test WS here'});
</script>
</body>
</html>
